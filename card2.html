<html>
   <head>
    <title>card2</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
        <style>
     .zoom-wrap-blog {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
    }

    .zoom-img {
      width: 100%;
      height: 300px;
      display: block;
      object-fit: cover;
      transition: transform .5s ease;
      transform-origin: center;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: opacity .5s ease;
    }

    .zoom-wrap-blog:hover .zoom-img {
      transform: scale(1.2);
    }

    .zoom-wrap-blog:hover .overlay {
      opacity: 1;
    }

    .card-title1:hover {
      color: #116530;
      cursor: pointer;
    }

    .read-more {
      color: #116530;
      font-weight: bold;
      cursor: pointer;
    }
        </style>
   </head>
   <body>
    <div class="card" style="width: 350px;">
    <div class="zoom-wrap-blog">
      <img src="image/blog-1.jpg" class="card-img-top zoom-img" alt="...">
      <div class="overlay"></div>
    </div>
        <div class="card-body">
          <p style="width: 120px; height: 30px; background-color: #116530; color: white;padding: 4px; text-align: center;margin-left: 213px;margin-top: -45px;position: relative;">DECEMBER 12</p>
        <h5 class="card-title1">Eum ad dolor et. Autem aut fugiat debitis</h5>
        <div class="d-flex text-muted">
            <span><i class="fa fa-user me-2"></i> Julia Parker /</span>
            <span class="ms-3"><i class="fa fa-file me-2"></i> Politics</span>
        </div>
        </div>
    <hr class="m-0">
    <div class="card-body">
      <p class="read-more">Read More →</p>
    </div>
  </div>
   </body>
</html>
