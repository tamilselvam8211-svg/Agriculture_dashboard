        <style>
           .zoom-wrap{
            position: relative;
            display: inline-block;
            overflow: hidden;
            width: 400px;
            height: 400px;
            /* border-radius: 6px; */
            }

        .zoom-img{
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform .5s ease;
            transform-origin: center;
            }
        .zoom-wrap:hover .zoom-img{
            transform: scale(1.2);
        }

        .zoom-overlay{
            position: absolute;
            inset: 0;                 
            background: rgba(0,0,0,.45);
            opacity: 0;
            transition: opacity .35s ease;
            display: flex;
            flex-direction: column;   
            justify-content: start;  
            align-items: flex-start; 
            padding-left: 20px;       
            gap: 6px;                 
            pointer-events: none;
        }
        .zoom-wrap:hover .zoom-overlay{
            opacity: 1;
        }

        .zoom-text
        {
            font-family: 'Times New Roman', Times, serif;
            color: #116530;
            margin: 0;
            opacity: 0;
            transition: opacity .35s ease, transform .35s ease;
            margin-top: 300px;
        }
        .zoom1-text{
            color: white;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            margin: 0;
            opacity: 0;
            transition: opacity .35s ease, transform .35s ease;
            margin-top: -10px;
        }
        .zoom-text { font-size: 20px; font-weight: 600; font-family: 'Times New Roman', Times, serif}
        .zoom1-text { font-size: 30px; font-weight: 700; font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;}

        .zoom-wrap:hover .zoom-text,
        .zoom-wrap:hover .zoom1-text {
            opacity: 1;
            transform: translateY(0);
        }
        </style>
    </head>
